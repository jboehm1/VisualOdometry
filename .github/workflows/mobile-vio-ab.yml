name: Real smartphone A/B visual and gyro inference
on:
  pull_request:
    paths: ["tools/campaigns/mobile_gvio_*.py", "tools/campaigns/tests/test_mobile_gvio_ab.py", ".github/workflows/mobile-vio-ab.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install rosbags opencv-python-headless scipy
      - name: Validate source and scoring contracts offline
        run: |
          python -m unittest discover -s tools/campaigns/tests -p 'test_mobile_gvio_ab.py' -v
          python -m unittest discover -s tools/campaigns/tests -p 'test_mobile_gvio.py' -v
          python -m unittest discover -s tools/campaigns/tests -p 'test_mobile_gvio_score.py' -v
  real-ab:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install rosbags opencv-python-headless scipy
      - name: Download once with pinned checksum and extract real smartphone data
        run: python tools/campaigns/mobile_gvio_fetch.py --out /tmp/mobile_vio_ab
      - name: Compare frozen tracking profiles on identical source frames and gyro
        run: |
          python tools/campaigns/mobile_gvio_ab.py --bag /tmp/mobile_vio_ab/indoor_2.bag --calib /tmp/mobile_vio_ab/orbslam3.yaml --truth /tmp/mobile_vio_ab/ground_truth.txt --seconds 22 --skip 8 --out campaign_results/mobile_vio_ab
      - name: Refuse false metric, independent-time or Android-APK assertions
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          d=json.loads(Path('campaign_results/mobile_vio_ab/comparison.json').read_text())
          assert d['status']=='PASS' and not d['metric_distance_accuracy_proven']
          assert not d['reference_gt_used_for_inference']
          assert not d['absolute_groundtruth_clock_calibrated_independently']
          assert d['benchmark_repetitions']==['balanced','low_compute','low_compute','balanced']
          a,b=(d['results'][k] for k in ('balanced','low_compute'))
          assert a['camera_frames']==b['camera_frames'] and a['camera_frames']>=25
          assert a['gyro_integrations']==b['gyro_integrations'] and a['gyro_integrations']>=100
          for v in (a,b):
              assert v['good_visual_pose_updates']>=8
              assert v['shape_score']['matched_pose_pairs']>=30
              assert not v['shape_score']['metric_accuracy']
              assert math.isfinite(v['median_wall_seconds'])
          print('REAL_PHONE_A_B_PASS',a['median_wall_seconds'],b['median_wall_seconds'])
          PY
      - name: Upload only small JSON evidence; no video or raw sensors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-phone-ab-shape-and-runtime
          path: |
            campaign_results/mobile_vio_ab/comparison.json
            campaign_results/mobile_vio_ab/trial_*/inference.json
          if-no-files-found: ignore
          retention-days: 30
