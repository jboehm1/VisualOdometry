name: GPX • real phone ARCore poses with GNSS dropout

on:
  pull_request:
    paths:
      - "tools/gpx_ar/**"
      - "tools/campaigns/advio09_real.py"
      - ".github/workflows/gpx-real-phone-dropout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_poses_gpx_blackout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Java toolchain for the EXACT Android GPX estimator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate shared GPX/Android Java engine and blackout contracts (offline)
        run: python -m unittest discover -s tools/gpx_ar/tests -v
      - name: Install existing ADVIO dataset reader requirements
        run: python -m pip install --quiet numpy opencv-python-headless
      - name: Download genuine ADVIO-09 phone data using existing pinned source+MD5
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.campaigns.advio09_real import download
          dataset=download(Path("campaign_results/advio09_cache"))
          print("PINNED_ADVIO_REAL_POSES_AVAILABLE", dataset.stat().st_size,flush=True)
          PY
      - name: Run exact GPX Android Java alignment on real phone ARCore poses with GNSS muted
        run: |
          python tools/gpx_ar/real_phone_dropout.py \
            --advio-zip campaign_results/advio09_cache/advio-09.zip \
            --out campaign_results/gpx-real-phone-blackout \
            --calibration-seconds 20 40 \
            --gnss-noise-axis-m 1.5
      - name: Require actual held-out position comparisons without fake GNSS results
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path("campaign_results/gpx-real-phone-blackout/report.json").read_text())
          assert d["schema"]=="vector-gpx-real-external-poses-dropout/1"
          assert len(d["results"])==2
          for r in d["results"]:
              assert r["gps_after_cutoff"]==0
              assert r["engine"]=="Android Java ArRouteGuide"
              oracle=r["calibrated_camera_drift"]
              assert oracle["scored_pose_count"]>=200
              assert oracle["post_dropout_duration_s"]>10
              assert math.isfinite(oracle["post_dropout_p95_m"])
              assert r["synthetic_gnss_calibration_fixes"]>=10
              if r["status"]=="SCORED":
                  assert r["matched"]>=8
                  assert r["last_dropout_seconds"]>10
                  assert math.isfinite(r["p95_error_m"])
                  assert "VIO_HOLD" in r["states"]
                  print("GPX_JAVA_GUIDE_GPS_BLACKOUT_SCORED",r,flush=True)
              else:
                  assert r["status"]=="NO_LOCATION_AFTER_CUTOFF"
                  assert r["matched"]==0
                  assert r["states"] # MUST show why Java refused alignment
                  print("GPX_JAVA_GUIDE_REFUSED_ALIGNMENT_NOT_SILENT_SUCCESS",r,flush=True)
              print("REAL_EXTERNAL_ARCORE_CAMERA_ONLY_DRIFT_MEASURED",
                    oracle,flush=True)
          # Deliberately NO p95 accuracy acceptance without independent Android
          # S21 GNSS+ARCore recordings. External phone ARCore != APK.
          PY
      - name: Upload small scoring diagnostics, never copied phone/video or pseudo-GNSS raw ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpx-real-arcore-phone-dropout
          path: |
            campaign_results/gpx-real-phone-blackout/report.json
            campaign_results/gpx-real-phone-blackout/cut_*/replay/summary.json
            campaign_results/gpx-real-phone-blackout/cut_*/replay/replay.csv
          if-no-files-found: ignore
          retention-days: 30
