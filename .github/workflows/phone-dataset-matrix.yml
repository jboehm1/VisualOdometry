name: V3 real smartphone dataset matrix

on:
  push:
    branches: [feature/testenv-phone-datasets-v3, feature/slam-explorer]
    paths:
      - 'tools/campaigns/unified.py'
      - 'tools/campaigns/tests/test_unified_phone.py'
      - 'tools/testenv/suites/real-phone.json'
      - 'tools/testenv/runner.py'
      - '.github/workflows/phone-dataset-matrix.yml'
  pull_request:
    paths:
      - 'tools/campaigns/unified.py'
      - 'tools/campaigns/tests/test_unified_phone.py'
      - 'tools/testenv/suites/real-phone.json'
      - 'tools/testenv/runner.py'
      - '.github/workflows/phone-dataset-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-dataset-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Registry, input protection and testenv plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all unified phone capability and provenance tests
        run: python -m unittest discover -s tools/campaigns/tests -p 'test_unified_phone.py' -v
      - name: Verify both real phone cases require no preexisting local dataset
        run: python testenv.py plan --suite tools/testenv/suites/real-phone.json

  advio:
    name: Actual 70MB ADVIO-09 / externally recorded Pixel ARCore
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless
      - name: Execute actual V3 suite (ADVIO case only)
        run: python testenv.py run --suite tools/testenv/suites/real-phone.json --only advio09 --out campaign_results/phone_matrix
      - name: Independently assert no false Android app accuracy claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('campaign_results/phone_matrix')
          data=json.loads((p/'latest.json').read_text())
          assert data['status']=='PASS' and data['counts']['PASS']==1
          case=data['cases'][0]
          assert case['dataset']=='advio09'
          assert case['actual_estimator_executed'] is False
          assert case['reference_used_to_score'] is True
          assert case['metrics']['original_camera_frames_decoded']>=100
          assert case['metrics']['original_gyro_samples']>=100
          report=json.loads(next(p.glob('runs/*/cases/advio09/report.json')).read_text())
          assert report['measured_engine']=='precomputed_external_Google_Pixel_ARCore'
          assert report['metric_distance_accuracy_proven'] is False
          assert report['accuracy_claim_level']=='external_pixel_arcore_trajectory_only'
          assert not list(p.glob('runs/*/cases/*/engine'))
          PY
      - name: Report only (no original image or sensor data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-advio09-phone-evidence
          path: |
            campaign_results/phone_matrix/index.html
            campaign_results/phone_matrix/latest.json
            campaign_results/phone_matrix/runs/*/summary.json
            campaign_results/phone_matrix/runs/*/cases/*/case.json
            campaign_results/phone_matrix/runs/*/cases/*/report.json
          if-no-files-found: ignore
          retention-days: 30

  mobile-gvio:
    name: Actual 951MB Mobile-GVIO / research visual+gyro Sim3
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual ROS camera, IMU and scoring dependencies
        run: python -m pip install rosbags opencv-python-headless scipy
      - name: Execute V3 suite on real smartphone frames and real gyro
        run: python testenv.py run --suite tools/testenv/suites/real-phone.json --only mobile-gvio --out campaign_results/phone_matrix
      - name: Assert truth was only used after inference and scale remains unmetric
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('campaign_results/phone_matrix')
          s=json.loads((p/'latest.json').read_text())
          assert s['status']=='PASS' and s['counts']['PASS']==1
          case=s['cases'][0]
          assert case['actual_estimator_executed'] and case['reference_used_to_score']
          assert case['metrics']['camera_frames_processed']>=25
          report=json.loads(next(p.glob('runs/*/cases/mobile-gvio/report.json')).read_text())
          assert report['accuracy_claim_level']=='research_shape_only_not_metric'
          assert report['metric_distance_accuracy_proven'] is False
          assert report['provenance']['time_and_scale_fitted_after_inference_using_GT']
          assert report['metrics']['matched_reference_pose_pairs']>=30
          assert not list(p.glob('runs/*/cases/*/engine'))
          PY
      - name: Publish only small reports, never original phone video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-mobile-gvio-phone-evidence
          path: |
            campaign_results/phone_matrix/index.html
            campaign_results/phone_matrix/latest.json
            campaign_results/phone_matrix/runs/*/summary.json
            campaign_results/phone_matrix/runs/*/cases/*/case.json
            campaign_results/phone_matrix/runs/*/cases/*/report.json
          if-no-files-found: ignore
          retention-days: 30
