name: Three campaigns • Real baselines and phone replay checks

on:
  push:
    branches:
      - feature/three-validation-campaigns
      - feature/slam-explorer
    paths:
      - "tools/campaigns/**"
      - ".github/workflows/three-campaigns.yml"
      - "app/src/main/java/dev/jboehm/vectorvio/MainActivity.java"
  pull_request:
    paths:
      - "tools/campaigns/**"
      - ".github/workflows/three-campaigns.yml"
      - "app/src/main/java/dev/jboehm/vectorvio/MainActivity.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-campaigns-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  a_real_public_trajectory:
    name: A • published VINS-Mono EuRoC MH01 trajectory vs GT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/benchmark/requirements.txt
      - name: Download public example trajectories pinned to OpenVINS Git commit
        run: |
          python tools/campaigns/public_trajectory.py --out campaign_results/a_euroc_external
      - name: Upload exact real-data comparison (NOT VECTOR Android accuracy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-a-vins-mono-euroc-public
          path: campaign_results/a_euroc_external/
          if-no-files-found: error
          retention-days: 30

  b_inertial_only:
    name: B • inertial-only PDR estimator and fixture integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/benchmark/requirements.txt
      - name: Run real estimator code with no camera dependency
        run: |
          python -m unittest discover -s tools/campaigns/tests -v
          python tools/campaigns/make_inertial_fixture.py --out campaign_results/b_camera_off/input
          python tools/campaigns/imu_pdr.py --imu campaign_results/b_camera_off/input/imu.csv --out campaign_results/b_camera_off/estimate
          python tools/campaigns/fixture_score.py --path campaign_results/b_camera_off/estimate/trajectory.tum --out campaign_results/b_camera_off/score.json
      - name: Upload camera-off baseline (SYNTHETIC signal, not field accuracy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-b-imu-only-synthetic-smoke
          path: campaign_results/b_camera_off/
          if-no-files-found: ignore
          retention-days: 30

  c_android_build:
    name: C • compile official ARCore MP4 same-engine replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK required}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and test APK with playback support
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Upload replay-enabled sideload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-c-arcore-replay-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
