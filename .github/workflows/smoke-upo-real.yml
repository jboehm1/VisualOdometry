name: Smoke UPO real-bag sensor benchmark (2.18GB)
on:
  # Avoid two parallel 2.18 GB jobs for a single PR branch push.
  # Run this expensive real corpus check on branch pushes or manual dispatch.
  push:
    branches:
      - feature/smoke-rescue-research
    paths:
      - '.github/workflows/smoke-upo-real.yml'
      - 'tools/testenv/suites/smoke-upo7-real.json'
      - 'tools/campaigns/unified.py'
      - 'tools/smoke_rescue/upo_real.py'
      - 'tools/smoke_rescue/probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-upo-real
  cancel-in-progress: false
jobs:
  real-upo:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      ORIGINAL_URL: https://robotics.upo.es/datasets/smoke/experiment_7.bag
      EXPECTED_BYTES: '2183007782'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ROS1 decoder (ROS installation not needed)
        run: python -m pip install --disable-pip-version-check rosbags==0.11.4
      - name: Validate adapter and no-silent-accuracy contract
        run: python -m unittest discover -s tools/smoke_rescue/tests -p 'test_*.py' -v
      - name: Download EXACT original public UPO experiment 7 bag
        timeout-minutes: 27
        run: |
          mkdir -p campaign_results/smoke-upo7
          # Original noncommercial dataset is transient, never an uploaded artifact.
          curl --fail --show-error --location --retry 2 --retry-delay 5 \
            --connect-timeout 30 --max-time 1500 \
            --proto '=https' --tlsv1.2 \
            --output "campaign_results/smoke-upo7/experiment_7.bag" "$ORIGINAL_URL"
          python - <<'PY'
          import os
          from pathlib import Path
          data=Path('campaign_results/smoke-upo7/experiment_7.bag')
          actual=data.stat().st_size
          assert actual == int(os.environ["EXPECTED_BYTES"]), f"Not the full published recording: {actual} bytes"
          print(f"ORIGINAL_PUBLIC_BAG_BYTES_VERIFIED={actual}")
          PY
      - name: Probe original Doppler / IMU / TF headers for calibrated motion research
        run: |
          python tools/smoke_rescue/probe.py \
            --bag campaign_results/smoke-upo7/experiment_7.bag \
            --out campaign_results/smoke-upo7/probe.json
      - name: Audit full original TF and calibrate sensor-only IMU clock
        timeout-minutes: 5
        run: |
          python tools/smoke_rescue/calibration_audit.py \
            --bag campaign_results/smoke-upo7/experiment_7.bag \
            --out campaign_results/smoke-upo7/tf_and_clock_report.json
      - name: Plan and execute canonical Test Environment V2 on original UPO recording
        timeout-minutes: 12
        run: |
          python -m tools.testenv.cli plan \
            --suite tools/testenv/suites/smoke-upo7-real.json \
            > campaign_results/smoke-upo7/plan.json
          python -m tools.testenv.cli run \
            --suite tools/testenv/suites/smoke-upo7-real.json \
            --out campaign_results/smoke-upo7-benchmark \
            > campaign_results/smoke-upo7/suite-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          cases=list(Path("campaign_results/smoke-upo7-benchmark/runs").glob("*/cases/upo7-radar-sensor/report.json"))
          assert len(cases)==1, f"Expected exactly one canonical case, got {len(cases)}"
          report=json.loads(cases[0].read_text())
          assert report["status"]=="PASS" and report["dataset_id"]=="upo_smoke"
          assert report["requested_engine"]=="radar-sensor-audit"
          assert report["actual_estimator_executed"] is False
          assert report["reference_used_to_score"] is False
          assert report["metric_distance_accuracy_proven"] is False
          print("REAL UPO original ROS data benchmarked via TESTENV V2; sensor metrics follow:")
          print(json.dumps(report["metrics"],sort_keys=True))
          PY
      - name: Infer actual Doppler + measured gyro dead reckoning, then posthoc score
        timeout-minutes: 7
        run: |
          python tools/smoke_rescue/doppler_odom.py \
            --bag campaign_results/smoke-upo7/experiment_7.bag \
            --max-seconds 60 \
            --out campaign_results/smoke-upo7/doppler_imu_research.json \
            --html campaign_results/smoke-upo7/doppler_imu_trajectory.html
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("campaign_results/smoke-upo7/doppler_imu_research.json")
          d=json.loads(p.read_text())
          assert d["actual_own_estimator_executed"] is True
          assert d["reference_used_during_estimation"] is False
          assert d["certified_navigation"] is False
          assert d["independent_accurate_ground_truth"] is False
          assert len(d["trajectory"]) >= 5
          print("Own radar+gyro estimator executed, posthoc pseudo-GT score:",d["pseudo_reference_posthoc_evaluation"])
          PY
      - name: Full 168-second real smoke generalization (same frozen estimator)
        timeout-minutes: 7
        run: |
          python tools/smoke_rescue/doppler_odom.py \
            --bag campaign_results/smoke-upo7/experiment_7.bag \
            --max-seconds 168 \
            --out campaign_results/smoke-upo7/doppler_imu_full168.json \
            --html campaign_results/smoke-upo7/doppler_imu_full168.html
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('campaign_results/smoke-upo7/doppler_imu_research.json').read_text())
          whole=json.loads(Path('campaign_results/smoke-upo7/doppler_imu_full168.json').read_text())
          assert whole['reference_used_during_estimation'] is False
          assert whole['independent_accurate_ground_truth'] is False
          assert whole['motion_observability']['accepted_bins'] >= first['motion_observability']['accepted_bins']
          print('REAL 168s source, frozen params:',json.dumps({
              'bins_accepted':whole['motion_observability']['accepted_bins'],
              'integrated_s':whole['motion_observability']['active_integrated_seconds'],
              'estimated_path_m':whole['motion_observability']['estimated_traveled_path_m'],
              'reference_posthoc':whole['pseudo_reference_posthoc_evaluation'],
              'positive_map':whole['sparse_positive_echo_map'],
          },sort_keys=True))
          PY
      - name: Upload evidence (reports and HTML only, never the dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-upo7-testenv-v2-evidence
          path: |
            campaign_results/smoke-upo7/*.json
            campaign_results/smoke-upo7/*.html
            campaign_results/smoke-upo7-benchmark/**/*.json
            campaign_results/smoke-upo7-benchmark/**/*.html
          if-no-files-found: warn
          retention-days: 14
      - name: Delete local copyrighted original
        if: always()
        run: rm -f "campaign_results/smoke-upo7/experiment_7.bag"
