name: Smoke UPO real-bag sensor benchmark (2.18GB)
on:
  pull_request:
    paths:
      - '.github/workflows/smoke-upo-real.yml'
      - 'tools/smoke_rescue/upo_real.py'
  push:
    branches:
      - feature/smoke-rescue-research
    paths:
      - '.github/workflows/smoke-upo-real.yml'
      - 'tools/testenv/suites/smoke-upo7-real.json'
      - 'tools/campaigns/unified.py'
      - 'tools/smoke_rescue/upo_real.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-upo-real
  cancel-in-progress: false
jobs:
  real-upo:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      ORIGINAL_URL: https://robotics.upo.es/datasets/smoke/experiment_7.bag
      EXPECTED_BYTES: '2183007782'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ROS1 decoder (ROS installation not needed)
        run: python -m pip install --disable-pip-version-check rosbags==0.11.4
      - name: Validate adapter and no-silent-accuracy contract
        run: python -m unittest discover -s tools/smoke_rescue/tests -p 'test_*.py' -v
      - name: Download EXACT original public UPO experiment 7 bag
        timeout-minutes: 27
        run: |
          mkdir -p campaign_results/smoke-upo7
          # Original noncommercial dataset is transient, never an uploaded artifact.
          curl --fail --show-error --location --retry 2 --retry-delay 5 \
            --connect-timeout 30 --max-time 1500 \
            --proto '=https' --tlsv1.2 \
            --output "campaign_results/smoke-upo7/experiment_7.bag" "$ORIGINAL_URL"
          python - <<'PY'
          import os
          from pathlib import Path
          data=Path('campaign_results/smoke-upo7/experiment_7.bag')
          actual=data.stat().st_size
          assert actual == int(os.environ["EXPECTED_BYTES"]), f"Not the full published recording: {actual} bytes"
          print(f"ORIGINAL_PUBLIC_BAG_BYTES_VERIFIED={actual}")
          PY
      - name: Plan and execute canonical Test Environment V2 on original UPO recording
        timeout-minutes: 12
        run: |
          python -m tools.testenv.cli plan \
            --suite tools/testenv/suites/smoke-upo7-real.json \
            > campaign_results/smoke-upo7/plan.json
          python -m tools.testenv.cli run \
            --suite tools/testenv/suites/smoke-upo7-real.json \
            --out campaign_results/smoke-upo7-benchmark \
            > campaign_results/smoke-upo7/suite-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          cases=list(Path("campaign_results/smoke-upo7-benchmark/runs").glob("*/cases/upo7-radar-sensor/report.json"))
          assert len(cases)==1, f"Expected exactly one canonical case, got {len(cases)}"
          report=json.loads(cases[0].read_text())
          assert report["status"]=="PASS" and report["dataset_id"]=="upo_smoke"
          assert report["requested_engine"]=="radar-sensor-audit"
          assert report["actual_estimator_executed"] is False
          assert report["reference_used_to_score"] is False
          assert report["metric_distance_accuracy_proven"] is False
          print("REAL UPO original ROS data benchmarked via TESTENV V2; sensor metrics follow:")
          print(json.dumps(report["metrics"],sort_keys=True))
          PY
      - name: Upload evidence (reports and HTML only, never the dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-upo7-testenv-v2-evidence
          path: |
            campaign_results/smoke-upo7/*.json
            campaign_results/smoke-upo7-benchmark/**/*.json
            campaign_results/smoke-upo7-benchmark/**/*.html
          if-no-files-found: warn
          retention-days: 14
      - name: Delete local copyrighted original
        if: always()
        run: rm -f "campaign_results/smoke-upo7/experiment_7.bag"
