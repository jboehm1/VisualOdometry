name: Raw EuRoC • source and camera IMU probe
on:
  push:
    branches: [feature/real-raw-vio-euroc]
    paths:
      - ".github/workflows/raw-euroc-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official public single-sequence mirrors without downloading gigabytes
        run: |
          python - <<'PY'
          import urllib.request, json, pathlib
          urls=[
            "https://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/machine_hall/MH_01_easy/MH_01_easy.zip",
            "https://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/vicon_room1/V1_01_easy/V1_01_easy.zip",
            "https://projects.asl.ethz.ch/datasets/euroc-mav/",
          ]
          results=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,method="HEAD",headers={"User-Agent":"VECTOR-vio-raw-test/1"})
              with urllib.request.urlopen(req,timeout=16) as f:
                entry={"url":url,"status":f.status,"final_url":f.url,"length":f.headers.get("Content-Length"),"content_type":f.headers.get("Content-Type")}
            except Exception as exc:
              entry={"url":url,"error":str(exc)}
            print(entry,flush=True)
            results.append(entry)
          pathlib.Path("probe.json").write_text(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw-euroc-source-probe
          path: probe.json
