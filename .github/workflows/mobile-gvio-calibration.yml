name: Phone VI calibration probe
on:
  push:
    branches: [feature/real-raw-vio-euroc]
    paths: [".github/workflows/mobile-gvio-calibration.yml"]
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect known research calibration
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,json
          record=json.load(urllib.request.urlopen("https://zenodo.org/api/records/20525157",timeout=20))
          item=next(f for f in record["files"] if f["key"]=="calib.zip")
          content=urllib.request.urlopen(item["links"]["self"],timeout=20).read()
          with zipfile.ZipFile(io.BytesIO(content)) as archive:
            for file in archive.namelist():
              if file.endswith(".yaml"):
                print("CAMERA_IMU_CALIB",file,archive.read(file).decode("utf8")[:3000],flush=True)
          PY
