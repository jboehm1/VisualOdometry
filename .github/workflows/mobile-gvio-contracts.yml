name: Real phone VIO • contract and reference tests
on:
  push:
    branches: [feature/real-raw-vio-euroc, feature/slam-explorer]
    paths:
      - "tools/campaigns/mobile_gvio_*.py"
      - "tools/campaigns/tests/test_mobile_gvio_score.py"
      - ".github/workflows/mobile-gvio-contracts.yml"
  pull_request:
    paths:
      - "tools/campaigns/mobile_gvio_*.py"
      - "tools/campaigns/tests/test_mobile_gvio_score.py"
      - ".github/workflows/mobile-gvio-contracts.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet numpy scipy
      - name: Compile actual camera IMU ingest and evaluator scripts
        run: python -m py_compile tools/campaigns/mobile_gvio_fetch.py tools/campaigns/mobile_gvio_raw.py tools/campaigns/mobile_gvio_score.py
      - name: Test post inference comparison and reject asynchronous references
        run: |
          python -m unittest discover -s tools/campaigns/tests -p test_mobile_gvio_score.py -v
          python -m unittest discover -s tools/campaigns/tests -p test_mobile_gvio_clock.py -v
