name: Real phone VIO • scoring contract unit tests
on:
  push:
    branches: [feature/real-raw-vio-euroc, feature/slam-explorer]
    paths:
      - "tools/campaigns/mobile_gvio_score.py"
      - "tools/campaigns/tests/test_mobile_gvio.py"
      - ".github/workflows/unit-phone-vio.yml"
  pull_request:
    paths:
      - "tools/campaigns/mobile_gvio_score.py"
      - "tools/campaigns/tests/test_mobile_gvio.py"
      - ".github/workflows/unit-phone-vio.yml"
permissions:
  contents: read
jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy
      - name: Reject mismatched timestamps and verify Sim3 is never called metric VO
        run: python -m unittest discover -s tools/campaigns/tests -p test_mobile_gvio.py -v
