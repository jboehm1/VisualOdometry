name: Android field CSV qualification contracts (synthetic only)
on:
  pull_request:
    paths:
      - "tools/field/**"
      - ".github/workflows/field-qualification.yml"
  push:
    branches: [feature/slam-explorer]
    paths:
      - "tools/field/**"
      - ".github/workflows/field-qualification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-field:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Check no fake S21 pass on missing data, path tamper or clock regression
        run: python -m unittest discover -s tools/field/tests -p 'test_*.py' -v
