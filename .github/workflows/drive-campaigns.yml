name: Private Drive • Manual SLAM campaigns

on:
  workflow_dispatch:
    inputs:
      campaign:
        type: choice
        description: "A vision+IMU, B IMU only, C phone CSV"
        options: [A, B, C]
        required: true
      kind:
        type: choice
        options: [euroc, tumvi, oxiod, canonical, phone_csv]
        required: true
      dataset_path:
        type: string
        description: "Folder under SLAM_BENCHMARKS/01_RAW"
        required: true
      input_file:
        type: string
        description: "Relative IMU/CSV file inside the selected folder (B/C)"
      estimate_file:
        type: string
        description: "Optional TUM estimated trajectory for A"
      known_distance_m:
        type: string
        description: "Independent measured path length for C"
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r tools/benchmark/requirements.txt
      - name: Set up pre-authorized rclone Drive remote
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.SLAM_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_B64" || { echo "Missing GitHub secret SLAM_RCLONE_CONFIG_B64"; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'slamdrive:'
      - name: Copy one requested input folder from private Drive
        shell: bash
        env:
          DATA_PATH: ${{ inputs.dataset_path }}
          INPUT_FILE: ${{ inputs.input_file }}
          ESTIMATE_FILE: ${{ inputs.estimate_file }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          for name in ("DATA_PATH","INPUT_FILE","ESTIMATE_FILE"):
              value=os.environ.get(name,"")
              if name=="DATA_PATH" and not value:raise SystemExit("Dataset path required")
              if value and (not re.fullmatch(r"[a-zA-Z0-9_./-]+",value) or value.startswith("/") or ".." in pathlib.PurePosixPath(value).parts):
                  raise SystemExit("Invalid relative path "+name)
          PY
          mkdir -p benchmark_data/raw
          rclone copy "slamdrive:SLAM_BENCHMARKS/01_RAW/$DATA_PATH" benchmark_data/raw --max-transfer 12G --stats 20s
          test "$(find benchmark_data/raw -type f | wc -l)" -gt 0
      - name: Run selected campaign without sending GT to estimator
        shell: bash
        env:
          MODE: ${{ inputs.campaign }}
          KIND: ${{ inputs.kind }}
          INPUT_FILE: ${{ inputs.input_file }}
          ESTIMATE_FILE: ${{ inputs.estimate_file }}
          KNOWN_DISTANCE: ${{ inputs.known_distance_m }}
        run: |
          set -euo pipefail
          args=(--campaign "$MODE" --kind "$KIND" --root benchmark_data/raw --out benchmark_data/results)
          if [ -n "$INPUT_FILE" ]; then args+=(--input "benchmark_data/raw/$INPUT_FILE"); fi
          if [ -n "$ESTIMATE_FILE" ]; then args+=(--estimate "benchmark_data/raw/$ESTIMATE_FILE"); fi
          if [ -n "$KNOWN_DISTANCE" ]; then args+=(--known-distance "$KNOWN_DISTANCE"); fi
          python tools/campaigns/run_dataset.py "${args[@]}"
      - name: Save only reports in private Drive
        if: success()
        shell: bash
        env:
          MODE: ${{ inputs.campaign }}
        run: |
          rclone copy benchmark_data/results "slamdrive:SLAM_BENCHMARKS/04_REPORTS/campaign_${MODE}_run_${{ github.run_id }}"
      - name: Upload only brief job status; no raw sensor data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-status-${{ github.run_id }}
          path: benchmark_data/results/status.json
          if-no-files-found: ignore
          retention-days: 7
