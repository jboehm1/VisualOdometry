name: Chat proof • genuine pedestrian IMU Java benchmark

on:
  push:
    branches: [feature/chat-live-dataset-proof-20261018, feature/slam-explorer]
    paths:
      - "tools/campaigns/chat_real_proof.py"
      - ".github/workflows/chat-real-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_data_proof:
    name: Real SIMUL sensors • 4 humans x 3 placements • actual Java PdrEngine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract regression
        run: python -m unittest discover -s tools/campaigns/tests -p 'test_android_pdr_bridge.py' -v
      - name: Actually download four separate real IMU captures and process in Java
        run: python tools/campaigns/chat_real_proof.py --out campaign_results/chat_proof
      - name: Validate the runtime proof without publishing original IMU files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("campaign_results/chat_proof")
          x=json.loads((r/"chat_proof_receipt.json").read_text())
          full=json.loads((r/"real_step_report.json").read_text())
          assert x["actual_Java_test_cases"] == 12
          assert x["participants"] == 4
          assert x["real_sample_timestamps"] > 30_000
          assert len(full["sequences"]) == 4
          assert all(len(q["positions"]) == 3 for q in full["sequences"])
          assert x["ground_truth_was_not_estimator_input"]
          assert not x["absolute_metric_distance_accuracy_established"]
          print("VERIFIED_REAL_JAVA_PDR_RUN", x)
          PY
      - name: Export minimal evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-proven-real-java-pdr-report
          path: |
            campaign_results/chat_proof/chat_proof_receipt.json
            campaign_results/chat_proof/real_step_report.json
          if-no-files-found: error
          retention-days: 30
