name: ADVIO genuine smartphone VIO externally scored plus raw video IMU audit
on:
  push:
    branches: [feature/advio-mini-raw-vio, feature/slam-explorer]
    paths:
      - "tools/campaigns/advio09_real.py"
      - ".github/workflows/advio-real.yml"
  pull_request:
    paths:
      - "tools/campaigns/advio09_real.py"
      - ".github/workflows/advio-real.yml"
permissions:
  contents: read
jobs:
  real_advio:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy opencv-python-headless
      - name: Download real raw camera gyro and external Pixel ARCore with verified ZIP checksum
        run: python tools/campaigns/advio09_real.py --out campaign_results/real_advio
      - name: Verify live raw multimodal audit and distinct external scoring
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path("campaign_results/real_advio/report.json").read_text())
          a=d["raw_multimodal_audit"];b=d["external_vision_imu_estimator_score"]
          assert a["raw_camera_and_gyro_processed"]
          assert a["raw_video_frames_decoded"]>=100
          assert a["real_gyro_samples_in_camera_window"]>=100
          assert b["matched_external_phone_pose_pairs"]>=40
          assert math.isfinite(b["ate_rmse_m_rigid_SE3_no_scale_fitting"])
          assert not b["actual_app_VECT0R_estimator_executed"]
          assert d["external_pose_is_not_our_android_app"]
          print("ADVIO_REAL_VIDEO_AND_IMU_WITH_EXTERNAL_ARCORE_SCORE",b,flush=True)
          PY
      - name: Upload small data and scoring report only, not video or raw sensors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advio-09-real-visual-imu-and-external-arcore
          path: campaign_results/real_advio/report.json
          if-no-files-found: ignore
          retention-days: 30
