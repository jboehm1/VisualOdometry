name: Real smartphone camera+IMU • inference and reference scoring
on:
  push:
    branches: [feature/real-raw-vio-euroc, feature/slam-explorer]
    paths:
      - "tools/campaigns/mobile_gvio_*.py"
      - ".github/workflows/real-phone-vio.yml"
  pull_request:
    paths:
      - "tools/campaigns/mobile_gvio_*.py"
      - ".github/workflows/real-phone-vio.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw_phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image, IMU and reference readers
        run: python -m pip install --quiet rosbags opencv-python-headless scipy
      - name: Download checksum-verified real smartphone signals to temporary disk
        run: python tools/campaigns/mobile_gvio_fetch.py --out /tmp/actual_phone
      - name: Estimate from actual camera image pixels and IMU without truth input
        run: |
          python tools/campaigns/mobile_gvio_raw.py \
            --bag /tmp/actual_phone/indoor_2.bag \
            --calib /tmp/actual_phone/orbslam3.yaml \
            --seconds 22 --skip 8 \
            --out campaign_results/raw_phone
      - name: Evaluate only after estimation against original independent reference
        run: |
          python tools/campaigns/mobile_gvio_score.py \
            --estimate campaign_results/raw_phone/estimate_unscaled.tum \
            --truth /tmp/actual_phone/ground_truth.txt \
            --out campaign_results/raw_phone/score.json
      - name: Check both raw image and real IMU were consumed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("campaign_results/raw_phone")
          i=json.loads((p/"inference.json").read_text())
          s=json.loads((p/"score.json").read_text())
          assert i["actual_images_processed"]>=25
          assert i["gyro_integrated_samples"]>=100
          assert i["visual_essential_pose_updates"]>=8
          assert s["matched_pose_pairs"]>=30
          assert s["estimator_metric_scale_observed"] is False
          print("REAL_CAMERA_AND_IMU_PROVEN",i["actual_images_processed"],
                i["gyro_integrated_samples"],i["visual_essential_pose_updates"],
                s["matched_pose_pairs"],flush=True)
          PY
      - name: Retain compact scientific reports, never recorded imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-raw-smartphone-vision-and-imu-score
          path: |
            campaign_results/raw_phone/inference.json
            campaign_results/raw_phone/score.json
          if-no-files-found: ignore
          retention-days: 30
