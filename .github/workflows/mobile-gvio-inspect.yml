name: Real smartphone camera IMU dataset download and inspection
on:
  push:
    branches: [feature/real-raw-vio-euroc]
    paths: [".github/workflows/mobile-gvio-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard rosbag reader
        run: python -m pip install --quiet rosbags
      - name: Download actual camera and IMU signals from original research archive
        run: |
          python - <<'PY'
          import json,urllib.request,pathlib,hashlib,zipfile,os
          root=pathlib.Path("/tmp/mobile_gvio")
          root.mkdir(exist_ok=True)
          record=json.load(urllib.request.urlopen("https://zenodo.org/api/records/20525157",timeout=30))
          item=next(f for f in record["files"] if f["key"]=="Indoor-2.zip")
          print("source",item["links"],"size",item["size"],"checksum",item["checksum"],flush=True)
          req=urllib.request.Request(item["links"]["self"],headers={"User-Agent":"VECTOR-odometer-vio/1"})
          checksum=hashlib.md5()
          total=0
          with urllib.request.urlopen(req,timeout=150) as src, (root/"Indoor-2.zip").open("wb") as dst:
            while data:=src.read(2*1024*1024):
              total+=len(data)
              if total>1100000000: raise ValueError("Unexpected archive size")
              checksum.update(data)
              dst.write(data)
          if total!=item["size"] or item["checksum"]!="md5:"+checksum.hexdigest():
            raise ValueError("Upstream checksum verification failed")
          print("VERIFIED_ORIGINAL_BYTES",total,flush=True)
          with zipfile.ZipFile(root/"Indoor-2.zip") as z:
            for f in z.infolist(): print("ZIP_MEMBER",f.filename,f.file_size,flush=True)
            for f in z.infolist():
              if f.filename.endswith((".bag",".txt")):
                target=root/pathlib.Path(f.filename).name
                with z.open(f) as src,target.open("wb") as dst:
                  while data:=src.read(2*1024*1024): dst.write(data)
                print("EXTRACTED",target,target.stat().st_size,flush=True)
          PY
      - name: Inspect real synchronized topics with rosbags
        run: |
          python - <<'PY'
          from rosbags.highlevel import AnyReader
          import pathlib
          d=pathlib.Path('/tmp/mobile_gvio')
          files=list(d.glob('*.bag'))
          if not files: raise RuntimeError("Real camera+IMU bag missing")
          with AnyReader(files) as r:
            print("BAG_DURATION_SECONDS",(r.end_time-r.start_time)/1e9,flush=True)
            print("BAG_MESSAGES",r.messages_count,flush=True)
            for c in r.connections:
              print("TOPIC",c.topic,c.msgtype,c.msgcount,flush=True)
            found={}
            for con,t,raw in r.messages():
              if con.topic not in found:
                obj=r.deserialize(raw,con.msgtype)
                found[con.topic]={"timestamp_ns":t,"type":con.msgtype}
                if hasattr(obj,"height"):found[con.topic].update({"width":obj.width,"height":obj.height,"encoding":obj.encoding})
                if hasattr(obj,"angular_velocity"):found[con.topic]["gyro_x"]=obj.angular_velocity.x
              if len(found)>=len(r.connections):break
            print("FIRST_MESSAGE_TYPES",found,flush=True)
          PY
