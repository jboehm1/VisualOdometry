name: PDR motion neural checkpoint trainer contract
on:
  pull_request:
    paths:
      - 'tools/pdr/train_motion_mlp.py'
      - 'tools/pdr/tests/test_motion_checkpoint_train.py'
      - 'tools/pdr/tests/test_oxiod_motion_features.py'
      - 'tools/pdr/oxiod_motion_features.py'
      - '.github/workflows/pdr-motion-mlp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-training-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only numerical training backend
        run: python -m pip install 'numpy>=1.26,<2.4'
      - name: Exercise training and SHA-pinned Java binary contract
        run: python -m unittest discover -s tools/pdr/tests -p 'test_*motion*.py' -v
      - name: Scope
        run: echo "Synthetic fixtures only; NO trained walking checkpoints or real accuracy claims."
