name: Native VIO portable contracts (not a VIO benchmark)
on:
  pull_request:
    paths:
      - "native/vio/**"
      - "tools/vio/**"
      - "tools/tests/test_native_vio_license_gate.py"
      - ".github/workflows/native-vio-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-and-license-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile engine-neutral C++17 native interface smoke
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic             -I native/vio native/vio/test_vio_contract.cpp             -o /tmp/vector-vio-api-smoke
          /tmp/vector-vio-api-smoke
      - name: Python fail-closed redistribution inventory tests
        run: |
          python3 -m unittest tools.tests.test_native_vio_license_gate -v
          python3 tools/vio/release_license_gate.py tools/vio/third_party.json
      - name: Ensure commercial release is still blocked until reviewed
        run: |
          if python3 tools/vio/release_license_gate.py tools/vio/third_party.json --release; then
            echo "::error::Unreviewed third-party distribution unexpectedly passed release gate"
            exit 1
          fi
          echo "Commercial release remains BLOCKED by design."
