name: PDR TinyML - train real SIMUL sensor placement proxy
on:
  push:
    branches: [feature/camera-free-pdr]
    paths:
      - 'tools/pdr/tiny_carry_train.py'
      - '.github/workflows/pdr-tinyml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-real-imu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight training dependency
        run: python -m pip install 'numpy>=2.0,<2.4'
      - name: Train small 24-16-3 supervised network and freeze subject-disjoint results
        run: python tools/pdr/tiny_carry_train.py --out app/build/reports/pdr-tinyml
      - name: Archive reports and model for audited diagnostic use (not release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdr-tinyml-research-checkpoint
          path: |
            app/build/reports/pdr-tinyml/training_report.json
            app/build/reports/pdr-tinyml/carry-model-v1.bin
          if-no-files-found: warn
          retention-days: 21
