name: Android • Build, Test & APK

on:
  push:
    branches:
      - feature/android-vio-odometer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests and installable APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK (debug-signed, for sideloading only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vector-vio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
