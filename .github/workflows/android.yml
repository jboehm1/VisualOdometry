name: Android • Build, Test & APK

on:
  push:
    branches:
      - feature/android-vio-odometer
      - feature/slam-explorer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push and PR events for the same commit should not waste two CI runners.
concurrency:
  # Keep push and PR checks for the same commit together, while allowing a
  # newer commit to validate independently if an older hosted runner stalls.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide an Android SDK.
      # android-actions/setup-android@v3 currently requests the removed
      # legacy 'tools' SDK package and fails before compilation.
      - name: Discover Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set by the runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Python telemetry-analysis unit tests
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s tools/gpx_ar/tests -v
      - name: Unit tests and installable APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: GPS matching regression with noisy parallel paths and dense routes
        run: |
          mkdir -p app/build/reports/gps
          bash tools/gps/run.sh app/build/reports/gps/trajectory.csv > app/build/reports/gps/summary.json
          cat app/build/reports/gps/summary.json
      - name: Execute three continuous laps on development and held-out reverse scenes
        run: |
          ./tools/simulation/run.sh app/build/reports/replay-a 3 default 15 1
          ./tools/simulation/run.sh app/build/reports/replay-b 3 reverse 15 1
          python3 tools/simulation/validate.py app/build/reports/replay-a app/build/reports/replay-b
      - name: Upload measured replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-replay-results
          path: |
            app/build/reports/replay-*/
            app/build/reports/gps/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload APK (debug-signed, for sideloading only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vector-vio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
