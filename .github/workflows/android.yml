name: Android • Build, Test & APK

on:
  push:
    branches:
      - feature/android-vio-odometer
      - feature/slam-explorer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push and PR events for the same branch should not waste two CI runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already provide an Android SDK.
      # android-actions/setup-android@v3 currently requests the removed
      # legacy 'tools' SDK package and fails before compilation.
      - name: Discover Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set by the runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: SDK platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Python telemetry-analysis unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Unit tests and installable APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APK (debug-signed, for sideloading only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vector-vio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
