name: Camera-free PDR • OxIOD and RoNIN native schema pipelines

on:
  push:
    branches:
      - feature/camera-free-pdr
    paths:
      - "tools/pdr/**"
      - "tools/tests/test_pdr_datasets.py"
      - "docs/PDR_DATASETS_PIPELINE.md"
      - ".github/workflows/pdr-datasets.yml"
  pull_request:
    paths:
      - "tools/pdr/**"
      - "tools/tests/test_pdr_datasets.py"
      - "docs/PDR_DATASETS_PIPELINE.md"
      - ".github/workflows/pdr-datasets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-schema-and-java-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the original HDF5 format decoder
        run: python3 -m pip install -r tools/pdr/requirements-datasets.txt
      - name: Native OxIOD and RoNIN schema unit tests, including same Java PDR engine
        run: python3 -m unittest discover -s tools/tests -p test_pdr_datasets.py -v
      - name: End-to-end original-format schema fixtures with Java replay and provenance
        run: python3 tools/pdr/smoke_datasets.py --out app/build/reports/pdr-native-schema
      - name: Publish tiny synthetic-schema reports, never restricted research corpora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdr-oxiod-ronin-schema-replay
          path: |
            app/build/reports/pdr-native-schema/smoke-status.json
            app/build/reports/pdr-native-schema/oxiod_prepared/manifest.json
            app/build/reports/pdr-native-schema/ronin_prepared/manifest.json
            app/build/reports/pdr-native-schema/oxiod_java/summary.json
            app/build/reports/pdr-native-schema/ronin_java/summary.json
            app/build/reports/pdr-native-schema/oxiod_java/report.json
            app/build/reports/pdr-native-schema/ronin_java/report.json
            app/build/reports/pdr-native-schema/oxiod_java/provenance.json
            app/build/reports/pdr-native-schema/ronin_java/provenance.json
          if-no-files-found: warn
          retention-days: 21

  android-build-and-lint:
    name: Android APK + Robolectric PDR + lint regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Java/PDR tests, lint, debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Upload current branch APK after green build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camera-free-pdr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
